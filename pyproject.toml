[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "aveva-e3d-mcp"
version = "0.2.1"
description = "MCP server for AI-assisted AVEVA E3D development and debugging"
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
geometry = ["manifold3d==3.5.5", "numpy>=1.26,<3"]

[project.scripts]
aveva-e3d-mcp = "aveva_e3d_mcp.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]
